{% extends "base.html" %}{% block content %}<div class="card"><h1>Dashboard</h1><p>Authenticated as <b>{{ user.email }}</b></p><p>Role: <b>{{ user.role }}</b></p></div><div class="card"><h2>Users</h2><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr>{% for u in users %}<tr><td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>{% endfor %}</table></div>{% endblock %}
