<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Invalidation Lab</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav><a class="brand" href="{{ url_for('index') }}">Session Invalidation Lab</a><span>{% if user %}<a href="{{ url_for('dashboard') }}">Dashboard</a>{% if user.role=='owner' %}<a href="{{ url_for('invite') }}">Invite</a><a href="{{ url_for('transfer') }}">Transfer</a>{% endif %}<form class="inline" method="post" action="{{ url_for('logout') }}"><button class="danger">Logout</button></form>{% else %}<a href="{{ url_for('login') }}">Login</a><a href="{{ url_for('forgot') }}">Forgot Password</a>{% endif %}</span></nav><main><div class="mode {{ mode }}">Mode: <b>{{ mode|upper }}</b></div>{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
